<form id="advanced-de-serach_form" class="advanced-de-serach_form">
    <div class="form-group advanced-de-term_wrap">
        <input type="text" name="term" class="form-control input-lg" id="advanced-de-term" placeholder="De name...">
        <span class="glyphicon glyphicon-refresh" aria-hidden="true"></span>
    </div>
    <div class="form-group">
        <div class="radio-inline">
            <input checked type="radio" name="searchmode" id="searchmode_contains" value="contains">
            <label for="searchmode_contains"> Contains</label>
        </div>
        <div class="radio-inline">
            <input type="radio" name="searchmode" id="searchmode_start" value="start">
            <label for="searchmode_start"> Start with</label>
        </div>
        <div class="radio-inline">
            <input type="radio" name="searchmode" id="searchmode_end" value="end"> 
            <label for="searchmode_end"> End with</label>
        </div>
        <div class="radio-inline">
            <input type="radio" name="searchmode" id="searchmode_eq" value="eq">
            <label for="searchmode_eq"> Equal</label>
        </div>
    </div>
</form>
<div class="advanced-de-search_listwrap">
    <ul id="advanced-de-search_list" class="list-unstyled"></ul>
</div>
